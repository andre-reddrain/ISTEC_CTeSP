<!-- Ficha de Trabalho 4
 Crie uma página web que permite ao utilizador inserir um nº inteiro positivo.
 O programa deve calcular e exibir a soma de todos os nºs de 1 até ao nº inserido.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Trabalho 4</title>
</head>
<body>
    <h1>Soma de números até n</h1>
    <p>Insira um nº inteiro positivo</p>
    <input type="number" id="userInput">
    <br>
    <br>
    <input type="button" onclick="somaN()" value="Calcular">
    <p id="errorMsg"></p>
    <p id="res"></p>
</body>
<script src="FichaTrabalho4.js"></script>
</html>
