<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Projeto Final - Autenticação por AD</title>
        <link rel="stylesheet" href="style.css">
        <link href='boxicons.min.css' rel='stylesheet'>
    </head>

    <body>
        <div class="wrapper">
            <form method="POST" id="form">
                <h1>Autenticação</h1>
                <div class="input-box">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                    <i class='bx bxs-user-circle'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                
                <button type="submit" class="btn" id="btnlogin">Login</button>
            </form>
        </div>

        <div class="wrapper">
            <h1>Auth Logs</h1>
            <div id="logs"></div>
        </div>
    </body>
</html>

<script>
    const form = document.querySelector("#form");
    const btnlogin = document.getElementById("btnlogin")

    form.addEventListener('submit', (event) => {
        event.preventDefault();

        btnlogin.disabled = true;

        const formData = new FormData(event.target);
        const formDataJson = Object.fromEntries(formData.entries());
        
        submit(formDataJson);
    })

    function submit(request) {
        fetch('info.php',{
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(request)
        }).then(response => {
            // console.log(response);
            // console.log(request);

            if(response.status === 200) {
                alert("Authentication Successfull")
                addLogEntry(request.username, 1);
            } else {
                alert("Authentication Failed")
                addLogEntry(request.username, 0);
            }

            btnlogin.disabled = false;
        })
    } 

    function addLogEntry(username, status) {
        const logContainer = document.getElementById('logs');

        const logEntry = document.createElement('div');
        logEntry.classList.add('log-entry', 'container');

        const userElement = document.createElement('h2')
        userElement.textContent = username;

        const statusElement = document.createElement('i')

        if (status === 1) {
            statusElement.classList.add('bx', 'bxs-check-circle');
            statusElement.style.color = "green";
        } else if (status === 0) {
            statusElement.classList.add('bx', 'bxs-x-circle')
            statusElement.style.color = "red";
        }

        logEntry.appendChild(userElement)
        logEntry.appendChild(statusElement)
        logContainer.appendChild(logEntry)
    }
</script>
