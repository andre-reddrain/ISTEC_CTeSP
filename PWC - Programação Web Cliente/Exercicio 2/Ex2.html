<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
    <style>
        td {
            border: 1px solid black;
            padding: 5px 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>1 Coluna</h3>
    <table style="border-collapse: collapse;">
        <tr>
            <td>100</td>
        </tr>
    </table>
    <br>
    <h3>1 Linha e 3 Colunas</h3>
    <table style="border-collapse: collapse;">
        <tr>
            <td>100</td>
            <td>200</td>
            <td>300</td>
        </tr>
    </table>
    <br>
    <h3>3 Linhas e 3 Colunas</h3>
    <table>
        <tr>
            <td style="border: none;">100</td>
            <td style="border: none;">200</td>
            <td style="border: none;">300</td>
        </tr>
        <tr>
            <td style="border: none;">400</td>
            <td style="border: none;">500</td>
            <td style="border: none;">600</td>
        </tr>
        <tr>
            <td style="border: none;">700</td>
            <td style="border: none;">800</td>
            <td style="border: none;">900</td>
        </tr>
    </table>
    <br>
</body>
</html>
