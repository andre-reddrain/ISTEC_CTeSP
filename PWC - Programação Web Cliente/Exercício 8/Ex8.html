<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
    <style>
        ol.a {
            list-style-type: lower-alpha;
        }

        table {
            width: 100%;
        }

        th {
            height: 75px;
            background-color: blue;
        }

        td {
            background-color: grey;
        }

        table, td, th {
            border: 5px solid red;
            text-align: center;
            vertical-align: top;
        }

        th {
            background-image: url("paper.png");
            color: red;
        }
    </style>
</head>
<body>
    <p>Exemplo de uma lista ordenada:</p>
    <ol type="a">
        <li>Andebol</li>
        <li>Basquetebol</li>
        <li>Futebol</li>
    </ol>

    <table>
        <tr>
            <th>Primeiro Nome</th>
            <th>Último Nome</th>
        </tr>
        <tr>
            <td>Jorge</td>
            <td>Santos</td>
        </tr>
        <tr>
            <td>Manuel</td>
            <td>Antunes</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Santos</td>
        </tr>
    </table>
</body>
</html>
